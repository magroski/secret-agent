name: release

# Tagging v1.2.3 publishes a macOS universal binary for that tag.
#
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (a dry run; publishes nothing)'
        required: true
        default: 'dev'

permissions:
  contents: write

jobs:
  macos:
    # Pinned rather than macos-latest: this job produces a signed artifact
    # people download, so the image should change when we say so.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The vault tests drive SA_VAULT_KEK_FILE rather than the real keychain,
      # so they run unattended here. Releasing an artifact whose tests never ran
      # would defeat the point of having adversarial ones.
      - name: Test
        run: go test ./...

      - name: Build
        run: scripts/build-macos.sh "${{ github.event.inputs.version || github.ref_name }}"

      - name: Verify the artifact runs and is a real universal binary
        run: |
          lipo -archs dist/sa-vault | tee /dev/stderr | grep -q x86_64
          lipo -archs dist/sa-vault | grep -q arm64
          codesign --verify --verbose=1 dist/sa-vault
          dist/sa-vault version

      - uses: actions/upload-artifact@v7
        with:
          name: sa-vault-darwin-universal
          path: dist/

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
